<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Prvi Sajt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #cbd5e1; font-size: 16px; line-height: 1.6; }
        .badge {
            background-color: #0284c7;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Zdravo Svet! 👋</h1>
        <p>Ovo je moj prvi sajt kreiran na GitHub-u i spreman za hosting preko Cloudflare Pages-a.</p>
        <span class="badge">Sistem Administracija & Web</span>
    </div>
</body>
</html>
